[package]
name = "gpui_ohos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_ohos.rs"

[features]
default = ["gpui/default"]

[dependencies]
gpui.workspace = true
gpui_text.workspace = true

[target.'cfg(target_env = "ohos")'.dependencies]
anyhow.workspace = true
async-task.workspace = true
etagere.workspace = true
futures.workspace = true
gpui_util.workspace = true
hex.workspace = true
libc.workspace = true
log.workspace = true
ohos-sys = { version = "0.9.0", default-features = false, features = [
    "api-23",
    "arkui",
    "asset-store",
    "drawing",
    "hilog",
    "inputmethod",
    "multimodal-input",
    "native_window",
    "pasteboard",
    "udmf",
    "xcomponent",
] }
ohos-sys-opaque-types = "0.1.10"
parking_lot.workspace = true
raw-window-handle.workspace = true
sha2.workspace = true
smol.workspace = true
uuid.workspace = true
